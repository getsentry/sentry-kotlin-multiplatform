[versions]
detekt = "1.23.8"
kotlin = "2.2.21"
pluginPublish = "1.3.1"
buildConfig = "5.5.1"
vanniktechPublish = "0.30.0"
kover = "0.9.1"
spmForKmp = "1.9.5"

[plugins]
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt"}
